[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lgsx-reader"
version = "0.1.0"
description = "Read Leica LGSX (TruView) files: project, point cloud, trajectory and photos; convert to LAS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21", "zstandard>=0.18"]
authors = [{ name = "Langford Geosystems" }]
keywords = ["lgsx", "truview", "leica", "point cloud", "lidar", "las", "mobile mapping", "pegasus", "cyclone"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lgsx = "lgsx_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
